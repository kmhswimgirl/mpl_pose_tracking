    image_width: 1920
    image_height: 1080
    camera_name: "field_cam"
    camera_info_url: "package://mpl_pose_tracking/config/webcam_test.yaml"
    brightness: -1
    contrast: -1
    saturation: -1
    sharpness: -1
    gain: -1