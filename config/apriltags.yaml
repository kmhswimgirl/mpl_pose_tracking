image_transport: compressed  
family: 36h11         
size: 0.1          
profile: false       
# tuning of detection (defaults)
max_hamming: 0        
detector:
  threads: 2          
  decimate: 2.0      
  blur: 0.0           
  refine: 1           
  sharpening: 0.25   
  debug: 0            

pose_estimation_method: "pnp" # method for estimating the tag pose